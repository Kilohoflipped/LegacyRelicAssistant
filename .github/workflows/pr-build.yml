name: PR Builder for LegacyRelicAssistant

on:
    pull_request:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: pr-build-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: write
    pull-requests: write

jobs:
    build:
        runs-on: windows-2022
        outputs:
            short_sha: ${{ steps.get-short-sha.outputs.short_sha }}
            dalamud_digest: ${{ steps.resolve-dalamud-release.outputs.asset_digest }}
            dalamud_cache_hit: ${{ steps.cache-dalamud.outputs.cache-hit }}
            format_outcome: ${{ steps.collect-results.outputs.format_outcome }}
            build_outcome: ${{ steps.collect-results.outputs.build_outcome }}
        env:
            DALAMUD_RELEASE_API_URI: https://api.github.com/repos/Dalamud-DailyRoutines/Dalamud/releases/latest
            DALAMUD_RELEASE_ASSET_NAME: latest.7z
            DALAMUD_ARCHIVE_FILENAME: dalamud-latest.7z

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  lfs: true

            - name: Install .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 10.0.x
                  cache: true
                  cache-dependency-path: |
                      LegacyRelicAssistant/packages.lock.json

            # 解析 DalamudCN 最新 Release 的 latest.7z
            - name: Resolve Dalamud Release
              id: resolve-dalamud-release
              shell: pwsh
              run: ./.github/scripts/pr-build/resolve-dalamud-release.ps1

            - name: Cache Dalamud
              id: cache-dalamud
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/${{ env.DALAMUD_ARCHIVE_FILENAME }}
                  key: dalamud-latest-${{ steps.resolve-dalamud-release.outputs.asset_digest }}

            - name: Install Dalamud
              shell: pwsh
              env:
                  RUNNER_TEMP: ${{ runner.temp }}
                  DALAMUD_CACHE_HIT: ${{ steps.cache-dalamud.outputs.cache-hit }}
                  DALAMUD_DOWNLOAD_URL: ${{ steps.resolve-dalamud-release.outputs.download_url }}
              run: ./.github/scripts/pr-build/install-dalamud.ps1

            - name: Restore NuGet Packages
              run: dotnet restore --locked-mode

            - name: Verify Code Formatting
              id: format-check
              run: dotnet format --verify-no-changes --verbosity minimal

            - name: Build
              id: compile
              run: dotnet build -c Release -p:Platform=x64 --no-restore -warnaserror

            - name: Collect Results
              if: always()
              id: collect-results
              shell: pwsh
              run: |
                  "format_outcome=${{ steps.format-check.outcome }}" >> $env:GITHUB_OUTPUT
                  "build_outcome=${{ steps.compile.outcome }}" >> $env:GITHUB_OUTPUT

            - name: Get Short SHA
              id: get-short-sha
              shell: pwsh
              run: echo "short_sha=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT

            - name: Store Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: LegacyRelicAssistant-${{ steps.get-short-sha.outputs.short_sha }}
                  path: ./LegacyRelicAssistant/bin/x64/Release/LegacyRelicAssistant/
                  if-no-files-found: error
                  retention-days: 1

    report:
        name: PR Summary
        runs-on: ubuntu-latest
        needs: build

        if: github.event_name == 'pull_request' && always()
        steps:
            - name: Checkout
              if: needs.build.result != 'cancelled'
              uses: actions/checkout@v5

            - name: Read Metadata
              if: needs.build.result != 'cancelled'
              id: meta
              shell: bash
              run: |
                  plugin_version=$(grep -oP '(?<=<Version>)[^<]+' LegacyRelicAssistant/LegacyRelicAssistant.csproj | head -1)
                  roslynator_version=$(grep -A3 '"Roslynator.Analyzers"' LegacyRelicAssistant/packages.lock.json | grep -oP '(?<="resolved": ")[^"]+' | head -1)
                  echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
                  echo "roslynator_version=$roslynator_version" >> "$GITHUB_OUTPUT"

            - name: Publish PR Comment
              uses: actions/github-script@v7
              env:
                  BUILD_RESULT: ${{ needs.build.result }}
                  FORMAT_OUTCOME: ${{ needs.build.outputs.format_outcome }}
                  BUILD_OUTCOME: ${{ needs.build.outputs.build_outcome }}
                  SHORT_SHA: ${{ needs.build.outputs.short_sha }}
                  DALAMUD_DIGEST: ${{ needs.build.outputs.dalamud_digest }}
                  DALAMUD_CACHE_HIT: ${{ needs.build.outputs.dalamud_cache_hit }}
                  PLUGIN_VERSION: ${{ steps.meta.outputs.plugin_version }}
                  ROSLYNATOR_VERSION: ${{ steps.meta.outputs.roslynator_version }}
              with:
                  script: |
                      const publishComment = require('./.github/scripts/pr-build/publish-pr-comment.js');
                      await publishComment({ github, context });
